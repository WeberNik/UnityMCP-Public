name: Build Prebuilt MCP Server

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: unity-mcp-server/package-lock.json

      - name: Install deps
        working-directory: unity-mcp-server
        run: npm ci

      - name: Build server
        working-directory: unity-mcp-server
        run: npm run build

      - name: Package prebuilt server
        run: |
          mkdir -p unity-mcp-server-prebuilt
          cp -r unity-mcp-server/dist unity-mcp-server-prebuilt/
          cp -r unity-mcp-server/node_modules unity-mcp-server-prebuilt/
          cp unity-mcp-server/package.json unity-mcp-server-prebuilt/
          cp unity-mcp-server/package-lock.json unity-mcp-server-prebuilt/
          cp README.md unity-mcp-server-prebuilt/
          cp LICENSE unity-mcp-server-prebuilt/
          zip -r unity-mcp-server-prebuilt.zip unity-mcp-server-prebuilt

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: unity-mcp-server-prebuilt.zip
